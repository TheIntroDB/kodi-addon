# This workflow performs the required add-on checks
# for TheIntroDB Kodi addon

name: Kodi Addon Check
on:
  # Run action when pushed to main, or for commits in a pull request.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Addon checker
    runs-on: ubuntu-latest
    strategy:
      # Report every supported release even if one leg fails early.
      fail-fast: false
      matrix:
        # --branch is the Kodi release codename the checker resolves dependencies
        # against, not a git branch. Nexus (20) is the oldest release the add-on
        # supports -- addon.xml requires xbmc.python 3.0.1, which Kodi 19 does not
        # provide -- and Omega (21) is the current one.
        kodi-release: [nexus, omega]
    steps:
    - uses: actions/checkout@v4
      with:
        path: ${{ github.repository }}
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --user kodi-addon-checker
    - name: Remove unwanted files
      run: awk '/export-ignore/ { print $1 }' .gitattributes | xargs rm -rf --
      working-directory: ${{ github.repository }}
      continue-on-error: true
    - name: Run kodi-addon-checker on repository
      # Reported problems are pre-existing (icon size, the <path> element) and
      # this step is intentionally non-blocking.
      run: >-
        "$HOME/.local/bin/kodi-addon-checker"
        --branch=${{ matrix.kodi-release }}
        "${{ github.repository }}/repository.tidb.repo/"
      continue-on-error: true
    - name: Run kodi-addon-checker on main addon
      run: >-
        "$HOME/.local/bin/kodi-addon-checker"
        --branch=${{ matrix.kodi-release }}
        "${{ github.repository }}/plugin.video.tidb/"
      continue-on-error: true
